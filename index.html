<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Room OS V2</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay"></div>

  <main class="container">

    <header class="hero-header">
      <h1>Smart Room OS</h1>
      <p>Kamar Tidur</p>
    </header>

    <!-- AC HERO CARD -->
    <section class="glass ac-card">
      <div class="card-header">
        <span>❄️ AC Kamar</span>
      </div>

      <div class="ac-temp" id="acTemp">
        --°
      </div>

      <div class="ac-mode" id="acMode">
        Loading...
      </div>

      <div class="slider-wrap">
        <input
          type="range"
          min="16"
          max="30"
          value="27"
          disabled
        >
      </div>

      <div class="ac-status" id="acFan">
        Fan Auto
      </div>
    </section>

    <!-- CLIMATE -->
    <section class="grid-2">

      <div class="glass stat-card">
        <div class="label">🌡 Suhu</div>
        <div class="value" id="roomTemp">--°C</div>
      </div>

      <div class="glass stat-card">
        <div class="label">💧 Humidity</div>
        <div class="value" id="roomHumidity">--%</div>
      </div>

    </section>

    <!-- DEVICE GRID -->
    <section class="grid-2">

      <div class="glass lamp-card">

  <div class="lamp-header">
    💡 Lampu Kamar
  </div>

  <div class="lamp-power" id="lampStatus">
    OFF
  </div>

  <div class="lamp-brightness">
    Brightness:
    <span id="lampBrightness">--%</span>
  </div>

  <div class="lamp-color">
    Warna:
    <span id="lampColor">--</span>
  </div>

  <div class="lamp-slider-wrap">

    <input
      type="range"
      min="1"
      max="100"
      value="1"
      disabled
      id="lampSlider"
    >

  </div>

</div>

      <div class="glass device-card">
        <div>📺 TV</div>
        <h3 id="tvStatus">--</h3>
      </div>

      <div class="glass device-card">
        <div>🎥 CCTV</div>
        <h3 id="cctvStatus">--</h3>
      </div>

      <div class="glass device-card">
        <div>🔌 Smartplug</div>
        <h3 id="plugPower">-- W</h3>
      </div>

    </section>

    <!-- DAILY STATS -->
    <section class="glass">
      <h2>📊 Statistik Hari Ini</h2>

      <div class="stats-grid">

        <div>
          <span>🎥 Motion</span>
          <strong id="motionToday">0</strong>
        </div>

        <div>
          <span>📺 TV Event</span>
          <strong id="tvEvents">0</strong>
        </div>

        <div>
          <span>❄️ AC Event</span>
          <strong id="acEvents">0</strong>
        </div>

        <div>
          <span>💡 Lamp Event</span>
          <strong id="lampEvents">0</strong>
        </div>

      </div>
    </section>

    <!-- ACTIVITY FEED -->
    <section class="glass">
      <h2>📰 Activity Feed</h2>

      <div id="activityFeed">

        <div class="feed-item">
          Loading...
        </div>

      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
